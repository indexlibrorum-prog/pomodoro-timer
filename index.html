<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>あわポモ風タイマー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="あわポモ">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#101219; --card:#181b25; --card2:#1f2330; --line:#2a2f3d;
    --fg:#e9ecf3; --fg-dim:#98a0b3;
    --idling:#ffc857; --work:#ff7a59; --rest:#4cc9a7;
    --radius:18px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f5f8; --card:#fff; --card2:#f0f2f6; --line:#e0e3ea; --fg:#1a1d26; --fg-dim:#6b7286; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
            calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    touch-action:manipulation;
    overscroll-behavior-y:contain;
  }
  button,.row,.due-list li,.cal .cell,.tabs button{-webkit-user-select:none;user-select:none}
  .app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  h1{font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--fg-dim);margin:4px 0 0;text-align:center}
  .view{display:flex;flex-direction:column;gap:14px}

  /* ---- タブバー ---- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
    background:color-mix(in srgb, var(--card) 88%, transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;background:none;border:0;border-radius:0;padding:9px 4px 10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:500;color:var(--fg-dim)}
  .tabbar button span{font-size:18px;line-height:1;opacity:.5}
  .tabbar button.on{color:var(--work)}
  .tabbar button.on span{filter:none;opacity:1}

  /* ---- 実行中のタイマー ---- */
  .minibar{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--work);border-radius:12px;padding:10px 14px;font-size:13px;text-align:left}
  .minibar .dot{width:8px;height:8px;border-radius:50%;background:var(--work);flex:none;
    animation:breathe 2.4s ease-in-out infinite}
  .minibar .t{font-variant-numeric:tabular-nums;font-weight:600;flex:none}
  .minibar .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-dim)}
  .minibar .go{flex:none;color:var(--fg-dim);font-size:12px}

  /* ---- 今日 ---- */
  .today-sect{margin-bottom:18px}
  .today-sect:last-child{margin-bottom:0}
  .today-sect > h2{font-size:12px;font-weight:600;color:var(--fg-dim);letter-spacing:.06em;
    margin:0 0 9px;display:flex;align-items:center;gap:7px}
  .today-sect > h2 b{background:var(--line);color:var(--fg-dim);border-radius:6px;padding:1px 6px;font-size:10px}
  .today-sect.late > h2{color:var(--work)}
  .today-sect.late > h2 b{background:var(--work);color:#fff}
  .tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .tlist li{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:11px;
    padding:11px 12px;border-left:3px solid transparent}
  .tlist input[type=checkbox]{width:19px;height:19px;accent-color:var(--rest);flex:none;margin:0}
  .tlist .body{flex:1;min-width:0;cursor:pointer}
  .tlist .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tlist .meta{font-size:11px;color:var(--fg-dim);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap}
  .tlist .play{flex:none;background:none;border:0;color:var(--work);font-size:17px;padding:5px 7px;border-radius:9px}
  .tlist .empty{font-size:13px;color:var(--fg-dim);text-align:center;padding:18px 4px;line-height:1.7}
  .chip{font-size:10px;font-weight:700;border-radius:5px;padding:2px 5px;background:var(--line);color:var(--fg-dim)}
  .chip.due{background:var(--work);color:#fff}
  .chip.rv{background:var(--idling);color:#3a2c05}
  .fold{background:none;border:0;color:var(--fg-dim);font-size:12px;padding:6px 0;text-align:left}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .sect-title{font-size:12px;color:var(--fg-dim);letter-spacing:.08em;margin:0 0 12px}
  .hidden{display:none !important}

  /* ---- タイマー ---- */
  .timer{display:flex;flex-direction:column;align-items:center;gap:18px}
  .task-row{display:flex;gap:8px;width:100%;align-items:stretch}
  .task-row .sm{flex:none;white-space:nowrap}
  .task-input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;
    color:var(--fg);font:inherit;font-size:15px;padding:12px 14px;text-align:center}
  .task-input:focus{outline:2px solid var(--work);outline-offset:1px}
  .task-view{font-size:15px;text-align:center;min-height:20px;word-break:break-word}
  .task-view:empty::before{content:"（無題）";color:var(--fg-dim)}

  .ring{position:relative;width:260px;height:260px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:var(--line);stroke-width:12}
  .ring .bar{fill:none;stroke:var(--accent,var(--work));stroke-width:12;stroke-linecap:round;
    transition:stroke-dashoffset .2s linear, stroke .3s}
  .ring.pulse .bar{animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.95}50%{opacity:.35}}
  .ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .phase{font-size:13px;letter-spacing:.12em;color:var(--fg-dim)}
  .time{font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
  .sub{font-size:12px;color:var(--fg-dim);font-variant-numeric:tabular-nums;min-height:16px;text-align:center}

  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
  button{font:inherit;font-size:15px;font-weight:600;border-radius:999px;border:1px solid var(--line);
    background:var(--card2);color:var(--fg);padding:13px 22px;cursor:pointer;transition:transform .08s,filter .15s}
  button:hover{filter:brightness(1.12)}
  button:active{transform:scale(.97)}
  button.primary{background:var(--work);border-color:transparent;color:#fff}
  button.rest{background:var(--rest);border-color:transparent;color:#08221b}
  button.ghost{background:transparent;color:var(--fg-dim)}
  button.wide{flex:1 1 160px}
  button.sm{font-size:13px;padding:8px 14px;font-weight:500}
  button:disabled{opacity:.4;cursor:default}

  .choice{width:100%;background:var(--card2);border:1px dashed var(--work);border-radius:14px;padding:16px;
    display:flex;flex-direction:column;gap:12px;align-items:center}
  .choice p{margin:0;font-size:15px;text-align:center}
  .choice .hint{font-size:12px;color:var(--fg-dim)}

  /* ---- 復習 ---- */
  .due-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .due-list li{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:11px;padding:10px 12px;font-size:14px;cursor:pointer}
  .due-list .b{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:var(--work);color:#fff}
  .due-list .b.today{background:var(--rest);color:#08221b}
  .due-list .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .due-list .p{font-size:11px;color:var(--fg-dim);white-space:nowrap}

  /* ---- 作業記録 ---- */
  .rec{padding:0;overflow:hidden}
  .rec-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px 18px 0;
    font-weight:500;font-size:13px}
  .rec-head .cur{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec-head .cur.none{color:var(--fg-dim)}
  .rec-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
  .crumb{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:12px;color:var(--fg-dim)}
  .crumb button{background:var(--card2);border:1px solid var(--line);padding:4px 9px;font-size:12px;
    font-weight:500;color:var(--fg-dim);border-radius:7px}
  .crumb button:last-child{color:var(--fg);background:none;border-color:transparent}
  .tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
  .tree .empty{font-size:13px;color:var(--fg-dim);padding:14px 4px;text-align:center;line-height:1.6}
  .row{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid transparent;
    border-left:3px solid transparent;border-radius:11px;padding:10px 12px;cursor:pointer}
  .row.sel{border-color:var(--work);background:color-mix(in srgb,var(--work) 12%,var(--card2))}
  .row.locked{border-color:var(--rest)}
  .row.over{opacity:.5}
  .row .ico{font-size:14px;line-height:1;flex:none}
  .row .body{flex:1;min-width:0}
  .row .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .row.done .nm{text-decoration:line-through;color:var(--fg-dim)}
  .row .tag{font-size:10px;font-weight:700;border-radius:5px;padding:2px 5px;background:var(--line);color:var(--fg-dim);flex:none;text-decoration:none}
  .row .tag.due{background:var(--work);color:#fff}
  .row .meta{font-size:11px;color:var(--fg-dim);margin-top:3px;font-variant-numeric:tabular-nums}
  .row .pbar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
  .row .pbar i{display:block;height:100%;border-radius:2px}
  .row .mini{flex:none;background:none;border:0;color:var(--fg-dim);font-size:15px;padding:6px 8px;border-radius:8px}
  .row input[type=checkbox]{width:17px;height:17px;accent-color:var(--rest);flex:none;margin:0}
  .rec-actions{display:flex;gap:8px;flex-wrap:wrap}
  .form{background:var(--card2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .form input[type=text],.form input[type=number],.form input[type=date],.form select{
    background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--fg);font:inherit;font-size:14px;padding:9px 11px;width:100%}
  .form .seg{display:flex;gap:8px}
  .form .seg button{flex:1;font-size:13px;padding:9px}
  .form .seg button.on{background:var(--work);color:#fff;border-color:transparent}
  .form .r{display:flex;gap:10px;align-items:center}
  .form label{font-size:12px;color:var(--fg-dim);flex:none}
  .form .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .form .swatches i{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent;display:block}
  .form .swatches i.on{border-color:var(--fg)}
  .form .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);cursor:pointer}
  .form .chk input{accent-color:var(--work);width:16px;height:16px;margin:0}

  /* ---- タイマーの対象選択 ---- */
  .pick-btn{width:100%;display:flex;align-items:center;gap:10px;background:var(--card2);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500;text-align:left}
  .pick-btn span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-btn .cv{color:var(--fg-dim);font-size:12px;flex:none;transition:transform .2s}
  .pick-btn.open .cv{transform:rotate(180deg)}
  .pick{width:100%;background:var(--card2);border-radius:12px;padding:8px;max-height:44vh;overflow:auto;
    display:flex;flex-direction:column;gap:4px}
  .pick h3{font-size:11px;color:var(--fg-dim);letter-spacing:.06em;margin:8px 6px 2px;font-weight:600}
  .pick button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;
    border-left:3px solid transparent;border-radius:9px;padding:9px 10px;text-align:left;font-weight:400}
  .pick button:hover{background:var(--card)}
  .pick button.on{background:var(--card);border-left-color:var(--work)}
  .pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .pick .pt{font-size:11px;color:var(--fg-dim);flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .none{font-size:13px;color:var(--fg-dim);text-align:center;padding:14px 4px;line-height:1.7}

  /* ---- ノイズ ---- */
  .noise{display:flex;align-items:center;gap:10px;width:100%;background:var(--card2);
    border-radius:12px;padding:8px 12px}
  .noise button.play{background:none;border:0;font-size:20px;padding:4px 6px;flex:none;line-height:1;opacity:.55}
  .noise button.play.on{opacity:1}
  .noise select{background:none;border:0;color:var(--fg);font:inherit;font-size:13px;padding:4px 2px;flex:none}
  .noise input[type=range]{flex:1;accent-color:var(--work);min-width:60px}

  /* ---- お知らせ ---- */
  .notice{background:var(--card);border:1px solid var(--idling);border-radius:14px;padding:14px 16px;
    display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.6}
  .notice .acts{display:flex;gap:8px}

  /* ---- バーコードスキャナ ---- */
  .scan{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
  .scan .stage{position:relative;flex:1;overflow:hidden;background:#000}
  .scan video{width:100%;height:100%;object-fit:cover;display:block}
  .scan .frame{position:absolute;left:8%;right:8%;top:36%;height:26%;border:2px solid var(--work);border-radius:12px;pointer-events:none}
  .scan .frame i{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--work);opacity:.85}
  .scan .msg{position:absolute;left:12px;right:12px;top:calc(36% - 52px);text-align:center;color:#fff;
    font-size:13px;line-height:1.6;text-shadow:0 1px 5px #000}
  .scan .panel{background:var(--card);padding:16px;display:flex;flex-direction:column;gap:12px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:62vh;overflow:auto}
  .scan .panel input{background:var(--card2);border:1px solid var(--line);border-radius:9px;
    color:var(--fg);font:inherit;font-size:15px;padding:10px 12px;width:100%}
  .book{display:flex;gap:12px;align-items:flex-start}
  .book img{width:58px;height:82px;object-fit:cover;border-radius:6px;background:var(--card2);flex:none}
  .book .t{font-size:15px;font-weight:600;line-height:1.4}
  .book .m{font-size:12px;color:var(--fg-dim);margin-top:5px;line-height:1.7}
  .row .cov{width:26px;height:37px;object-fit:cover;border-radius:4px;flex:none;background:var(--line)}

  /* ---- ダッシュボード ---- */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--card2);border-radius:12px;padding:12px 10px;text-align:center}
  .stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat .k{font-size:11px;color:var(--fg-dim);margin-top:3px}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:1;font-size:13px;font-weight:500;padding:8px;border-radius:10px}
  .tabs button.on{background:var(--work);color:#fff;border-color:transparent}
  .chart-opts{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--fg-dim);margin-bottom:10px;flex-wrap:wrap}
  .chart-opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .chart-opts input[type=checkbox]{accent-color:var(--work);width:15px;height:15px;margin:0}
  .chart-opts select{background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:12px;padding:4px 8px}
  .chart{display:flex;align-items:flex-end;gap:8px;height:104px}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .chart .barwrap{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
  .chart .b{width:100%;background:var(--work);border-radius:3px;min-height:2px;opacity:.9}
  .chart .b.solo{border-radius:6px 6px 3px 3px}
  .chart .b.today{background:var(--idling)}
  .chart .b.zero{background:var(--line);opacity:1}
  .chart .d{font-size:10px;color:var(--fg-dim)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:12px;color:var(--fg-dim)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:3px;display:block;flex:none}

  .cal-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;font-size:14px;font-variant-numeric:tabular-nums}
  .cal-head button{background:none;border:0;color:var(--fg-dim);font-size:18px;padding:4px 10px;border-radius:8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .wd{text-align:center;font-size:10px;color:var(--fg-dim);padding-bottom:2px}
  .cal .cell{aspect-ratio:1/1;border-radius:8px;background:var(--card2);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;overflow:hidden}
  .cal .cell.blank{background:none}
  .cal .cell.today{outline:2px solid var(--idling);outline-offset:-2px}
  .cal .cell b{font-size:12px;font-weight:500}
  .cal .cell small{font-size:9px;opacity:.8}
  .cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--fg-dim)}
  .cal-scale{display:flex;align-items:center;gap:3px}
  .cal-scale i{width:11px;height:11px;border-radius:3px;display:block}

  .log{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
  .log li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 10px;background:var(--card2);border-radius:9px}
  .log .t{color:var(--fg-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .log .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- 設定 ---- */
  details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  summary{padding:16px 20px;cursor:pointer;font-size:14px;color:var(--fg-dim);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"⚙ "}
  .settings-body{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
  .field input[type=number],.field input[type=text]{width:96px;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--fg);font:inherit;padding:8px 10px;text-align:right}
  .field .desc{font-size:11px;color:var(--fg-dim);margin-top:2px}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;pointer-events:none;transition:background .2s}
  .switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
  .switch input:checked + span{background:var(--rest)}
  .switch input:checked + span::after{transform:translateX(20px)}
  .danger{color:#ff6b6b;border-color:#ff6b6b55;background:transparent;font-size:13px;padding:9px 16px}
  footer{text-align:center;font-size:11px;color:var(--fg-dim);line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <button class="minibar hidden" id="miniBar">
    <span class="dot" id="miniDot"></span>
    <span class="t" id="miniTime">0:00</span>
    <span class="n" id="miniName"></span>
    <span class="go">開く ›</span>
  </button>

  <!-- ============ 今日 ============ -->
  <div class="view" id="viewToday">
    <h1>今日</h1>

    <div class="notice hidden" id="backupNote">
      <div id="backupNoteText"></div>
      <div class="acts">
        <button class="sm primary" id="backupNow">バックアップする</button>

<script>
(() => {
  'use strict';

  // ===== 保存領域 =====
  const K_CFG='awapomo.cfg', K_REC='awapomo.records', K_LOG='awapomo.log', K_TREE='awapomo.tree',
        K_UI='awapomo.ui', K_DONE='awapomo.done';
  const BUILD = '2026-08-05 試験終了後の復習を止める';
  const CIRC = 2 * Math.PI * 116;
  const PALETTE = ['#ff7a59','#ffc857','#4cc9a7','#7aa2ff','#c792ea','#f06292','#4dd0e1','#a5d66d','#9aa4b8'];

  const DEFAULT_CFG = {
    idlingMin:1, autoSec:15, checkinMin:0,
    steps:'1,3,7,14', reviewHour:9,
    noiseKind:'brown', noiseVol:35, noiseAuto:false, noiseInRest:false,
    sound:true, notify:false, wake:false, hideRec:false
  };

  const load = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch { return fb; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let cfg     = Object.assign({}, DEFAULT_CFG, load(K_CFG, {}));
  let records = load(K_REC, {});     // 'YYYY-MM-DD' -> {work, rest, sessions}
  let logs    = load(K_LOG, []);     // [{start, sec, label, nodeId}] 新しい順
  let tree    = load(K_TREE, {});    // id -> node
  let dones   = load(K_DONE, []);    // [{id, name, date, at}] 完了ログ（新しい順）
  const UI_DEFAULT = { lockedId:null, byTask:false, depth:1, view:'bar', lastBackup:0, backupSnooze:0,
                       tab:'today', showNoDate:false };
  let ui      = Object.assign({}, UI_DEFAULT, load(K_UI, {}));

  const $ = id => document.getElementById(id);

  // ===== タイマー状態 =====
  const IDLE='idle', IDLING='idling', CHOICE='choice', WORK='work', REST='rest';
  let st = { mode:IDLE, segStart:0, sessionWork:0, sessionRest:0, sessionStart:0, label:'', nodeId:null, choiceStart:0, counted:false };
  let lastFlush = 0, wakeLock = null;
  let browseId = null, selId = null;
  let dayStamp = null;
  let calMonth = (() => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();

  // ===== 小道具 =====
  const pad = n => String(n).padStart(2,'0');
  const mmss = sec => {
    sec = Math.max(0, Math.floor(sec));
    const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
    return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  };
  const humanMin = sec => {
    const m = Math.round(sec/60);
    return m>=60 ? `${Math.floor(m/60)}時間${m%60 ? m%60+'分' : ''}` : `${m}分`;
  };
  const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseDay = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const weekKey = d => { const t=new Date(d); t.setDate(t.getDate()-t.getDay()); return dayKey(t); };
  const addDays = (d, n) => { const t=new Date(d); t.setDate(t.getDate()+n); return t; };
  const diffDays = (a, b) => Math.round((parseDay(a) - parseDay(b)) / 86400000);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const parseSteps = s => {
    const a = String(s||'').split(',').map(x => parseInt(x,10)).filter(n => n>0);
    return a.length ? a : null;
  };
  const stepList = () => parseSteps(cfg.steps) || [1,3,7,14];

  // ===== 音・通知 =====
  let actx = null;
  function tone(freq, at, dur, gain=0.14){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0, actx.currentTime+at);
    g.gain.linearRampToValueAtTime(gain, actx.currentTime+at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+at+dur);
    o.connect(g).connect(actx.destination);
    o.start(actx.currentTime+at); o.stop(actx.currentTime+at+dur+0.05);
  }
  function beep(kind){
    if(!cfg.sound) return;
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
      if(kind==='prompt'){ tone(880,0,.28); tone(1174,.16,.34); }
      else if(kind==='rest'){ tone(660,0,.3,.10); }
      else { tone(523,0,.22,.10); }
    }catch{}
  }
  function notify(body){
    if(!cfg.notify || !('Notification' in window) || Notification.permission!=='granted') return;
    try{ new Notification('あわポモ風タイマー', {body, silent:true}); }catch{}
  }
  async function updateWakeLock(){
    const want = cfg.wake && st.mode!==IDLE;
    try{
      if(want && !wakeLock && 'wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
      }else if(!want && wakeLock){ await wakeLock.release(); wakeLock=null; }
    }catch{ wakeLock=null; }
  }

  // ===== ツリー =====
  const childrenOf = pid => Object.values(tree)
    .filter(n => (n.parent||null) === (pid||null))
    .sort((a,b) => a.type!==b.type ? (a.type==='folder' ? -1 : 1)
                 : (a.order||0)!==(b.order||0) ? (a.order||0)-(b.order||0)
                 : a.createdAt-b.createdAt);
  function pathOf(id){
    const out=[]; let n = tree[id], guard=0;
    while(n && guard++<20){ out.unshift(n); n = n.parent ? tree[n.parent] : null; }
    return out;
  }
  const nameOf = id => (tree[id] ? pathOf(id).map(n=>n.name).join(' / ') : '');
  const colorOf = id => {
    const p = pathOf(id);
    for(let i=p.length-1;i>=0;i--) if(p[i].color) return p[i].color;
    return PALETTE[0];
  };
  // 学習モード：資格などのフォルダでだけ忘却曲線リマインドを使う
  const studyOn = id => pathOf(id).some(n => n.study);
  const stepsFor = id => {
    const p = pathOf(id);
    for(let i=p.length-1;i>=0;i--) if(p[i].steps) { const s = parseSteps(p[i].steps); if(s) return s; }
    return stepList();
  };
  const reviewOn = n => n.type==='task' && n.review && studyOn(n.parent);
  // 学習モードのフォルダでは終了日を「試験日」として扱う
  const examOf = id => {
    const p = pathOf(id);
    for(let i=p.length-1;i>=0;i--) if(p[i].study && p[i].endDate) return p[i].endDate;
    return null;
  };
  // 試験が終わったら、その復習はもうリマインドしない
  const examPassed = id => { const e = examOf(id); return !!e && diffDays(e, dayKey()) < 0; };
  const autoOf = id => {
    const p = pathOf(id);
    for(let i=p.length-1;i>=0;i--) if(p[i].study) return p[i].autoSteps !== false;
    return true;
  };
  // 標準の忘却曲線。ただし試験までの残り日数の半分は超えない
  // （試験が近づくほど自動的に間隔が詰まり、必ず試験前にもう一度復習が入る）
  function nextReviewOf(task){
    const steps = stepsFor(task.id);
    let interval = steps[Math.min(task.reviewIdx||0, steps.length-1)];
    const exam = examOf(task.id);
    if(exam && autoOf(task.id)){
      const left = diffDays(exam, dayKey());
      if(left <= 0) return null;                       // 試験が終わっている
      interval = Math.max(1, Math.min(interval, Math.floor(left/2)));
    }
    return dayKey(addDays(new Date(), interval));
  }

  // ===== 繰り返し =====
  const WD = ['日','月','火','水','木','金','土'];
  function recurOf(n){
    if(n.recur) return n.recur;
    // 旧データ（repeat: daily / weekly）からの移行
    return { freq: n.repeat==='daily' ? 'daily' : n.repeat==='weekly' ? 'weekly' : 'none',
             every:1, days:[], monthDay:null };
  }
  const isRecurring = n => n.type==='task' && recurOf(n).freq !== 'none';
  // 毎日・毎週はやり残しても翌日に持ち越さない（急かさないための自動リセット）。
  // 毎月・毎年は家賃振込のように落とせないものが多いので、遅延として残す。
  const carriesOver = n => ['monthly','yearly'].includes(recurOf(n).freq);

  function stepDue(n, fromKey){
    const r = recurOf(n), every = Math.max(1, r.every||1), d = parseDay(fromKey);
    if(r.freq==='daily') return dayKey(addDays(d, every));
    if(r.freq==='weekly'){
      const days = (r.days && r.days.length) ? r.days : [d.getDay()];
      for(let i=1;i<=7*every+7;i++){
        const t = addDays(d, i);
        if(days.includes(t.getDay())) return dayKey(t);
      }
      return dayKey(addDays(d, 7*every));
    }
    if(r.freq==='monthly'){
      // 基準日より後で最初に来る「◯日」を探す（月末指定と、31日が無い月にも対応）
      for(let i=0;i<=13;i++){
        const t = new Date(d.getFullYear(), d.getMonth() + i*every, 1);
        const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
        t.setDate(r.monthDay==='last' ? last : Math.min(Number(r.monthDay) || d.getDate(), last));
        if(dayKey(t) > fromKey) return dayKey(t);
      }
      return null;
    }
    if(r.freq==='yearly'){
      for(let i=0;i<=2;i++){
        const t = new Date(d); t.setFullYear(d.getFullYear()+i);
        if(dayKey(t) > fromKey) return dayKey(t);
      }
      return null;
    }
    return null;
  }
  function nextDue(n, fromKey){
    let k = stepDue(n, fromKey || n.due || dayKey()), guard = 0;
    while(k && diffDays(k, dayKey()) < 0 && guard++ < 500) k = stepDue(n, k);
    return k;
  }
  function autoReset(){
    let changed = false;
    Object.values(tree).forEach(n => {
      if(!isRecurring(n) || carriesOver(n)) return;
      if(n.due && diffDays(n.due, dayKey()) < 0){ n.due = nextDue(n, n.due); changed = true; }
    });
    if(changed) save(K_TREE, tree);
  }
  function recurLabel(n){
    const r = recurOf(n), e = Math.max(1, r.every||1);
    if(r.freq==='daily')   return e===1 ? '毎日' : `${e}日ごと`;
    if(r.freq==='weekly')  return (r.days && r.days.length ? r.days.slice().sort().map(d=>WD[d]).join('・')
                                                          : '毎週') + (e===1 ? '' : ` ${e}週ごと`);
    if(r.freq==='monthly') return r.monthDay==='last' ? '毎月末' : `毎月${r.monthDay||''}日`;
    if(r.freq==='yearly')  return '毎年';
    return '';
  }
  const dueLabel = key => {
    const d = diffDays(key, dayKey());
    return d===0 ? '今日' : d===1 ? '明日' : d===-1 ? '昨日' : d>0 ? `あと${d}日` : `${-d}日超過`;
  };

  function isDone(n){
    if(n.type!=='task' || !n.doneAt) return false;
    if(reviewOn(n))    return n.nextReview ? diffDays(n.nextReview, dayKey())>0 : true;
    if(isRecurring(n)) return n.doneAt === dayKey();
    return true;
  }
  const isOver = n => n.type==='folder' && n.endDate && diffDays(dayKey(), n.endDate) > 0;
  function removeNode(id){
    childrenOf(id).forEach(c => removeNode(c.id));
    delete tree[id];
    if(ui.lockedId===id) ui.lockedId=null;
    if(selId===id) selId=null;
  }
  function toggleDone(n, on){
    if(on){
      // 取り消せるように、進める前の状態を控えておく
      n.prev = { doneAt:n.doneAt||null, nextReview:n.nextReview||null, reviewIdx:n.reviewIdx||0, due:n.due||null };
      n.doneAt = dayKey();
      dones.unshift({ id:n.id, name:n.name, date:dayKey(), at:Date.now() });
      dones = dones.slice(0, 1000); save(K_DONE, dones);
      if(reviewOn(n)){
        n.nextReview = nextReviewOf(n);
        n.reviewIdx = Math.min((n.reviewIdx||0)+1, stepsFor(n.id).length-1);
      }else if(isRecurring(n)){
        n.due = nextDue(n, n.due || dayKey());
      }
    }else if(n.prev){
      n.doneAt = n.prev.doneAt; n.nextReview = n.prev.nextReview;
      n.reviewIdx = n.prev.reviewIdx; n.due = n.prev.due;
      n.prev = null;
      const i = dones.findIndex(d => d.id === n.id);
      if(i >= 0){ dones.splice(i, 1); save(K_DONE, dones); }
    }else{
      // 控えが無い古いデータ向けの後始末
      n.doneAt = null;
      if(reviewOn(n)){ n.reviewIdx = Math.max(0, (n.reviewIdx||0)-1); n.nextReview = dayKey(); }
    }
    save(K_TREE, tree);
  }

  // ===== 集計 =====
  function descendants(id){
    const ids = new Set([id]);
    const walk = pid => childrenOf(pid).forEach(c => { ids.add(c.id); walk(c.id); });
    walk(id);
    return ids;
  }
  function sumFor(id, from){
    const ids = descendants(id);
    return logs.reduce((a,l) => a + ((ids.has(l.nodeId) && (!from || l.start>=from)) ? l.sec : 0), 0);
  }
  function taskCount(id){
    let done=0, total=0;
    descendants(id).forEach(i => { const n=tree[i]; if(n && n.type==='task'){ total++; if(isDone(n)) done++; } });
    return {done, total};
  }
  const startOfToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };

  // ===== 日次記録 =====
  function addToday(kind, sec){
    if(sec<=0) return;
    const r = records[dayKey()] || (records[dayKey()] = {work:0, rest:0, sessions:0});
    r[kind] += sec;
  }
  function flush(){
    const now = Date.now(), d = (now-lastFlush)/1000;
    lastFlush = now;
    if(d<=0 || d>3600*6) return;
    if(st.mode===IDLING || st.mode===WORK) addToday('work', d);
    else if(st.mode===REST) addToday('rest', d);
    save(K_REC, records);
  }
  function endSeg(){
    const s = (Date.now()-st.segStart)/1000;
    if(st.mode===IDLING || st.mode===WORK) st.sessionWork += s;
    else if(st.mode===REST) st.sessionRest += s;
  }

  // ===== 遷移 =====
  function goto(mode){
    flush();
    if(st.mode!==IDLE && st.mode!==CHOICE) endSeg();
    st.mode = mode;
    st.segStart = Date.now();
    if(mode===CHOICE) st.choiceStart = Date.now();
    if(mode===REST && !cfg.noiseInRest) noiseStop();
    else if(mode===WORK && cfg.noiseAuto && !noisePlaying) noisePlay();
    render(); updateWakeLock();
  }
  function startSession(){
    st.nodeId = ui.lockedId && tree[ui.lockedId] ? ui.lockedId : null;
    st.label  = $('taskInput').value.trim() || (st.nodeId ? tree[st.nodeId].name : '');
    st.sessionWork = 0; st.sessionRest = 0;
    st.sessionStart = Date.now(); st.counted = false;
    lastFlush = Date.now();
    beep('start');
    if(cfg.noiseAuto) noisePlay();   // ボタン操作の流れで鳴らす（iOS の自動再生制限を避ける）
    goto(IDLING);
  }
  function finishSession(){
    flush();
    if(st.mode!==IDLE && st.mode!==CHOICE) endSeg();
    const work = Math.round(st.sessionWork);
    if(work>=30){
      const k = dayKey(new Date(st.sessionStart));
      const r = records[k] || (records[k] = {work:0, rest:0, sessions:0});
      if(!st.counted){ r.sessions += 1; st.counted = true; }
      logs.unshift({ start: st.sessionStart, sec: work, label: st.label, nodeId: st.nodeId });
      logs = logs.slice(0, 2000);
      save(K_LOG, logs); save(K_REC, records);
    }
    st.mode = IDLE; st.sessionWork = 0; st.sessionRest = 0;
    noiseStop();
    render(); renderStats(); renderTree(); updateWakeLock();
  }

  // ===== タイマー描画 =====
  function setRing(p, color, pulse){
    $('bar').style.strokeDasharray = CIRC;
    $('bar').style.strokeDashoffset = CIRC * (1 - Math.min(1, Math.max(0, p)));
    $('ring').style.setProperty('--accent', color);
    $('ring').classList.toggle('pulse', !!pulse);
  }
  function button(text, cls, fn){
    const b = document.createElement('button');
    b.textContent = text; b.className = cls; b.onclick = fn;
    return b;
  }
  function render(){
    const seg = (Date.now()-st.segStart)/1000;
    const idlingSec = cfg.idlingMin*60, checkinSec = cfg.checkinMin*60;
    const sessionWork = st.sessionWork + (st.mode===IDLING||st.mode===WORK ? seg : 0);
    const acts = $('actions');

    renderPickerHead();
    $('taskView').classList.toggle('hidden', st.mode===IDLE);
    $('taskView').textContent = st.label;
    $('choice').classList.toggle('hidden', st.mode!==CHOICE);
    acts.classList.toggle('hidden', st.mode===CHOICE);
    if(st.mode!==CHOICE) acts.innerHTML = '';

    if(st.mode===IDLE){
      $('phase').textContent='じゅんび';
      $('time').textContent=mmss(idlingSec);
      $('sub').textContent = ui.lockedId && tree[ui.lockedId] ? nameOf(ui.lockedId) : `まずは${cfg.idlingMin}分だけ`;
      setRing(1,'var(--line)',false);
      acts.append(button(`${cfg.idlingMin}分だけ はじめる`,'primary wide',startSession));

    }else if(st.mode===IDLING){
      const left = idlingSec - seg;
      $('phase').textContent='アイドリング';
      $('time').textContent=mmss(left);
      $('sub').textContent='とりあえず手をつけるだけ';
      setRing(seg/idlingSec,'var(--idling)',false);
      acts.append(
        button('もう乗った → 作業へ','primary',()=>goto(WORK)),
        button('休憩する','rest',()=>{ beep('rest'); goto(REST); }),
        button('やめる','ghost',finishSession)
      );
      if(left<=0){ beep('prompt'); notify(`${cfg.idlingMin}分たちました。続ける？`); goto(CHOICE); }

    }else if(st.mode===CHOICE){
      $('phase').textContent='どうする？';
      $('time').textContent=mmss(sessionWork);
      $('sub').textContent='作業時間';
      setRing(1,'var(--work)',true);
      $('choiceTitle').textContent = `${cfg.idlingMin}分たちました。`;
      const left = Math.ceil(cfg.autoSec - (Date.now()-st.choiceStart)/1000);
      $('choiceHint').textContent = `${Math.max(0,left)}秒後に自動で続行します`;
      if(left<=0) goto(WORK);

    }else if(st.mode===WORK){
      $('phase').textContent='作業ちゅう';
      $('time').textContent=mmss(sessionWork);
      $('sub').textContent = checkinSec>0 ? `次の声かけまで ${mmss(checkinSec-seg)}` : '休憩したくなったらいつでも';
      setRing(checkinSec>0 ? seg/checkinSec : 1, 'var(--work)', checkinSec<=0);
      acts.append(
        button('休憩する（スキップ）','rest wide',()=>{ beep('rest'); goto(REST); }),
        button('終了','ghost',finishSession)
      );
      if(checkinSec>0 && seg>=checkinSec){ beep('prompt'); notify('まだ続ける？'); goto(CHOICE); }

    }else if(st.mode===REST){
      $('phase').textContent='きゅうけい';
      $('time').textContent=mmss(st.sessionRest+seg);
      $('sub').textContent=`作業 ${humanMin(st.sessionWork)}　／　休憩は測るだけ`;
      setRing(1,'var(--rest)',true);
      acts.append(
        button('作業にもどる','primary wide',()=>{ beep('start'); goto(WORK); }),
        button('終了','ghost',finishSession)
      );
    }
    // 対象なしで測っているときは、途中でも一覧に登録して紐づけられる
    if(st.mode!==IDLE && st.mode!==CHOICE && !st.nodeId && st.label){
      acts.append(button('この作業を一覧に登録', 'ghost sm', () => registerFromText(st.label, true)));
    }

    document.title = st.mode===IDLE ? 'あわポモ風タイマー'
      : `${$('time').textContent} ${st.mode===REST?'☕':'⏱'} ${st.label||'あわポモ'}`;
    renderMini();
  }

  // ===== タブ =====
  const VIEWS = { today:'viewToday', timer:'viewTimer', list:'viewList', log:'viewLog' };
  function setTab(v){
    if(!VIEWS[v]) v = 'today';
    ui.tab = v; save(K_UI, ui);
    Object.entries(VIEWS).forEach(([k,id]) => $(id).classList.toggle('hidden', k!==v));
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.view===v));
    renderMini();
    if(v==='today') renderToday();
    if(v==='timer') renderPicker();
    if(v==='list')  renderTree();
    if(v==='log')   renderStats();
    window.scrollTo({ top:0 });
  }
  document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => setTab(b.dataset.view));

  function renderMini(){
    const on = st.mode !== IDLE && ui.tab !== 'timer';
    $('miniBar').classList.toggle('hidden', !on);
    if(!on) return;
    $('miniTime').textContent = $('time').textContent;
    $('miniName').textContent = `${$('phase').textContent}　${st.label || ''}`;
    $('miniDot').style.background = st.mode===REST ? 'var(--rest)'
                                  : st.mode===IDLING ? 'var(--idling)' : 'var(--work)';
  }
  $('miniBar').onclick = () => setTab('timer');

  // ===== タイマーの対象選択 =====
  // 一覧に登録済みのタスクから選ぶだけ。ここでは追加や編集はしない。
  let pickOpen = false;

  function pickRow(n){
    const b = document.createElement('button');
    b.className = ui.lockedId === n.id ? 'on' : '';
    b.style.borderLeftColor = ui.lockedId === n.id ? colorOf(n.id) : 'transparent';
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = (n.type==='folder' ? '📁 ' : isDone(n) ? '✓ ' : '') + n.name;
    if(isDone(n)) nm.style.color = 'var(--fg-dim)';
    const pt = document.createElement('span'); pt.className = 'pt';
    pt.textContent = pathOf(n.id).slice(0,-1).map(x => x.name).join(' / ');
    b.append(nm, pt);
    b.onclick = () => {
      ui.lockedId = n.id; save(K_UI, ui);
      pickOpen = false;
      selId = n.id; browseId = n.parent || null;
      renderPicker(); render(); renderTree();
    };
    return b;
  }

  // 見出しだけの更新。タイマーの毎フレーム描画から呼ぶので一覧は組み直さない
  function renderPickerHead(){
    const locked = ui.lockedId && tree[ui.lockedId];
    $('pickCur').textContent = locked ? `対象：${nameOf(ui.lockedId)}` : '対象：未選択（自由入力）';
    $('pickCur').style.color = locked ? colorOf(ui.lockedId) : '';
    $('pickBtn').classList.toggle('open', pickOpen);
    // 対象が決まっていれば自由入力欄は不要
    $('taskRow').classList.toggle('hidden', st.mode !== IDLE || !!locked);
    $('pickBtn').classList.toggle('hidden', st.mode !== IDLE);
    $('pickList').classList.toggle('hidden', !pickOpen || st.mode !== IDLE);
  }

  function renderPicker(){
    renderPickerHead();
    if(!pickOpen) return;

    const box = $('pickList'); box.innerHTML = '';
    const today = dayKey();
    const soon = [], rest = [], done = [], folders = [];
    Object.values(tree).forEach(n => {
      if(n.type === 'folder'){ folders.push(n); return; }
      if(n.type !== 'task') return;
      if(isDone(n)){ done.push(n); return; }
      const rv = (!cfg.hideRec && reviewOn(n) && n.nextReview && !examPassed(n.id)) ? diffDays(n.nextReview, today) : null;
      const du = n.due ? diffDays(n.due, today) : null;
      const vals = [rv, du].filter(v => v !== null);
      (vals.length && Math.min(...vals) <= 0 ? soon : rest).push(n);
    });
    // そのほかは一覧と同じ並び（フォルダごとにまとまる）にする
    const folderPath = n => pathOf(n.id).slice(0,-1).map(x => x.name).join(' / ');
    const byOrder = (a,b) => (a.order||0) - (b.order||0) || a.createdAt - b.createdAt;
    const byFolder = (a,b) => folderPath(a).localeCompare(folderPath(b), 'ja') || byOrder(a,b);
    soon.sort(byOrder);
    rest.sort(byFolder); done.sort(byFolder); folders.sort(byFolder);

    if(!soon.length && !rest.length && !done.length && !folders.length){
      const p = document.createElement('div'); p.className = 'none';
      p.textContent = 'まだ何も登録されていません。「一覧」タブか「今日」タブから追加してください。';
      box.append(p);
    }
    const sect = (title, arr) => {
      if(!arr.length) return;
      const h = document.createElement('h3'); h.textContent = title;
      box.append(h);
      arr.forEach(n => box.append(pickRow(n)));
    };
    sect('今日のもの', soon);
    sect('そのほか', rest);
    sect('フォルダごとに測る', folders);
    sect('完了ずみ', done);

    const h = document.createElement('h3'); h.textContent = '　';
    const clr = document.createElement('button');
    clr.className = ui.lockedId ? '' : 'on';
    const cn = document.createElement('span'); cn.className = 'nm';
    cn.textContent = '対象を決めずに測る';
    cn.style.color = 'var(--fg-dim)';
    clr.append(cn);
    clr.onclick = () => {
      ui.lockedId = null; save(K_UI, ui);
      pickOpen = false;
      renderPicker(); render(); renderTree();
    };
    box.append(h, clr);
  }
  $('pickBtn').onclick = () => { pickOpen = !pickOpen; renderPicker(); };

  // タイマーで自由入力した内容を、そのまま一覧のタスクとして登録する
  function registerFromText(text, linkCurrent){
    const nm = (text || '').trim();
    if(!nm) return null;
    const sibs = childrenOf(browseId);
    const id = uid();
    tree[id] = {
      id, type:'task', name:nm, parent:browseId||null, createdAt:Date.now(),
      order:(sibs.length ? Math.max(...sibs.map(s=>s.order||0))+1 : 0),
      color:null, startDate:null, endDate:null, study:false, autoSteps:true, steps:'',
      planMin:0, due:null, recur:{ freq:'none', every:1, days:[], monthDay:null },
      review:false, doneAt:null, reviewIdx:0, nextReview:null
    };
    selId = id;
    ui.lockedId = id; save(K_UI, ui);
    save(K_TREE, tree);
    if(linkCurrent){ st.nodeId = id; st.label = nm; }   // 計測中なら、この記録もタスクに紐づける
    renderTree(); renderToday(); renderPicker(); render();
    return id;
  }
  $('btnRegister').onclick = () => {
    if(!$('taskInput').value.trim()){ $('taskInput').focus(); return; }
    registerFromText($('taskInput').value);
    $('taskInput').value = '';
  };

  // ===== 今日 =====
  function todayItems(){
    const today = dayKey();
    const late = [], now = [], noDate = [];
    Object.values(tree).forEach(n => {
      if(n.type!=='task' || isDone(n)) return;
      const rv = (!cfg.hideRec && reviewOn(n) && n.nextReview && !examPassed(n.id)) ? diffDays(n.nextReview, today) : null;
      const du = n.due ? diffDays(n.due, today) : null;
      const vals = [rv, du].filter(v => v !== null);
      if(!vals.length){ noDate.push({ n, left:null }); return; }
      const left = Math.min(...vals);
      const item = { n, left, review: rv !== null && rv <= 0 && (du === null || rv <= du) };
      if(left < 0) late.push(item);
      else if(left === 0) now.push(item);
    });
    late.sort((a,b) => a.left - b.left);
    return { late, now, noDate };
  }

  function taskRow(item){
    const n = item.n;
    const li = document.createElement('li');
    li.style.borderLeftColor = colorOf(n.id);

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.onclick = e => { e.stopPropagation(); toggleDone(n, cb.checked); renderToday(); renderTree(); renderStats(); };
    li.append(cb);

    const body = document.createElement('div'); body.className = 'body';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = n.name;
    const meta = document.createElement('div'); meta.className = 'meta';
    const path = pathOf(n.id).slice(0,-1).map(x => x.name).join(' / ');
    if(path) meta.append(Object.assign(document.createElement('span'), { textContent: path }));
    if(item.review){
      const c = document.createElement('span'); c.className = 'chip rv'; c.textContent = '復習';
      meta.append(c);
    }
    if(item.left !== null){
      const c = document.createElement('span');
      c.className = 'chip' + (item.left <= 0 ? ' due' : '');
      c.textContent = item.review && n.nextReview ? dueLabel(n.nextReview) : dueLabel(n.due);
      meta.append(c);
    }
    if(isRecurring(n)){
      const c = document.createElement('span'); c.className = 'chip'; c.textContent = '🔁' + recurLabel(n);
      meta.append(c);
    }
    if(n.planMin > 0){
      const c = document.createElement('span'); c.className = 'chip'; c.textContent = `${n.planMin}分`;
      meta.append(c);
    }
    body.append(nm, meta);
    body.onclick = () => { browseId = n.parent || null; selId = n.id; setTab('list'); openForm('edit', n); };
    li.append(body);

    const play = document.createElement('button');
    play.className = 'play'; play.textContent = '▶'; play.title = 'このタスクで計測を始める';
    play.onclick = e => {
      e.stopPropagation();
      ui.lockedId = n.id; save(K_UI, ui);
      $('taskInput').value = '';
      setTab('timer');
      if(st.mode === IDLE) startSession();
      renderTree();
    };
    li.append(play);
    return li;
  }

  function section(title, items, cls){
    const box = document.createElement('div'); box.className = 'today-sect' + (cls ? ' '+cls : '');
    const h = document.createElement('h2');
    h.append(document.createTextNode(title));
    const b = document.createElement('b'); b.textContent = items.length; h.append(b);
    const ul = document.createElement('ul'); ul.className = 'tlist';
    items.forEach(it => ul.append(taskRow(it)));
    box.append(h, ul);
    return box;
  }

  function renderToday(){
    const box = $('todaySections'); box.innerHTML = '';
    const { late, now, noDate } = todayItems();

    if(late.length) box.append(section('遅れているもの', late, 'late'));
    if(now.length)  box.append(section('今日やること', now));

    if(!late.length && !now.length){
      const p = document.createElement('div');
      p.className = 'tlist';
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = Object.values(tree).some(n => n.type==='task')
        ? '今日ぶんは片づきました。'
        : 'タスクがまだありません。下の「＋ タスクを追加」から作れます。';
      p.append(e); box.append(p);
    }

    if(noDate.length){
      const wrap = document.createElement('div'); wrap.className = 'today-sect';
      const t = document.createElement('button'); t.className = 'fold';
      t.textContent = `${ui.showNoDate ? '▾' : '▸'} 期日なし（${noDate.length}）`;
      t.onclick = () => { ui.showNoDate = !ui.showNoDate; save(K_UI, ui); renderToday(); };
      wrap.append(t);
      if(ui.showNoDate){
        const ul = document.createElement('ul'); ul.className = 'tlist';
        noDate.forEach(it => ul.append(taskRow(it)));
        wrap.append(ul);
      }
      box.append(wrap);
    }
  }
  $('btnQuickAdd').onclick = () => { setTab('list'); openForm('add', null); };

  // ===== 作業記録UI =====
  function renderHead(){
    const locked = ui.lockedId && tree[ui.lockedId];
    $('recCur').textContent = locked ? `計測対象：${nameOf(ui.lockedId)}` : '計測対象：未選択';
    $('recCur').classList.toggle('none', !locked);
    $('recCur').style.color = locked ? colorOf(ui.lockedId) : '';
    $('btnDecide').disabled = !selId;
    // 参考書のスキャンは学習モードのフォルダの中でだけ
    $('btnScan').classList.toggle('hidden', cfg.hideRec || !studyOn(browseId));
    $('btnIcs').classList.remove('hidden');
    $('btnUp').classList.toggle('hidden', !browseId);
  }
  function renderCrumb(){
    const c = $('crumb'); c.innerHTML = '';
    const mk = (label, id) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => { browseId = id; selId = null; renderTree(); };
      return b;
    };
    c.append(mk('ホーム', null));
    pathOf(browseId).forEach(n => {
      const sep = document.createElement('span'); sep.textContent = '›';
      c.append(sep, mk(n.name, n.id));
    });
  }
  function tag(text, cls){
    const s = document.createElement('span'); s.className = 'tag' + (cls?' '+cls:''); s.textContent = text;
    return s;
  }
  function renderTree(){
    renderHead(); renderCrumb();
    const list = $('tree'); list.innerHTML = '';
    const kids = childrenOf(browseId);
    if(!kids.length){
      const p = document.createElement('li');
      p.className = 'empty';
      p.textContent = browseId ? 'このフォルダは空です。「＋ 追加」から作れます。'
                               : '教科やプロジェクトのフォルダを作ると、時間をタスク別に記録できます。';
      list.append(p);
      return;
    }
    const today = dayKey();
    kids.forEach(n => {
      const done = isDone(n), over = isOver(n);
      const li = document.createElement('li');
      li.className = 'row' + (selId===n.id?' sel':'') + (ui.lockedId===n.id?' locked':'')
                   + (done?' done':'') + (over?' over':'');
      li.style.borderLeftColor = n.type==='folder' ? (n.color || 'transparent') : 'transparent';

      if(n.type==='task'){
        const cb = document.createElement('input');
        cb.type='checkbox'; cb.checked = done;
        cb.onclick = e => { e.stopPropagation(); toggleDone(n, cb.checked); renderTree(); };
        li.append(cb);
      }else if(n.cover){
        const img = document.createElement('img');
        img.className='cov'; img.src=n.cover; img.alt=''; img.referrerPolicy='no-referrer';
        img.onerror = () => { img.className='ico'; img.replaceWith(Object.assign(document.createElement('span'), {className:'ico', textContent:'📕'})); };
        li.append(img);
      }else{
        const ico = document.createElement('span'); ico.className='ico'; ico.textContent = n.isbn ? '📕' : '📁';
        li.append(ico);
      }

      const body = document.createElement('div'); body.className='body';
      const nm = document.createElement('div'); nm.className='nm';
      nm.append(document.createTextNode(n.name));
      if(over) nm.append(tag('終了'));
      if(n.type==='folder' && n.study) nm.append(tag('学習'));
      if(reviewOn(n)){
        const d = n.nextReview ? diffDays(n.nextReview, today) : 0;
        nm.append(!n.nextReview ? tag('復習')
          : d<=0 ? tag(d===0 ? '今日' : `${-d}日超過`, 'due')
          : tag(`あと${d}日`));
      }
      body.append(nm);

      const todaySec = sumFor(n.id, startOfToday()), total = sumFor(n.id);
      const meta = document.createElement('div'); meta.className='meta';

      if(n.type==='folder'){
        const c = taskCount(n.id);
        let period = '';
        if(n.study && n.endDate){
          const left = diffDays(n.endDate, today);
          period = (left > 0 ? `試験まで あと${left}日` : left === 0 ? '試験は今日' : '試験は終了') + '　';
        }else if(n.startDate || n.endDate){
          period = `${(n.startDate||'').slice(5).replace('-','/')}〜${(n.endDate||'').slice(5).replace('-','/')}　`;
        }
        const book = n.isbn ? `${n.author ? n.author+'　' : ''}` : '';
        meta.textContent = `${book}${period}タスク ${c.done}/${c.total}　累計 ${humanMin(total)}`;
        body.append(meta);
      }else if(n.planMin>0){
        const repeating = (n.repeat && n.repeat!=='none') || reviewOn(n);
        const base = repeating ? todaySec : total;
        meta.textContent = `${repeating?'今日':'累計'} ${humanMin(base)} / 予定 ${n.planMin}分`;
        body.append(meta);
        const pb = document.createElement('div'); pb.className='pbar';
        const i = document.createElement('i');
        i.style.width = `${Math.min(100, base/(n.planMin*60)*100)}%`;
        i.style.background = base >= n.planMin*60 ? 'var(--rest)' : colorOf(n.id);
        pb.append(i); body.append(pb);
      }else{
        const bits = [];
        if(n.due) bits.push(`期日 ${n.due.slice(5).replace('-','/')}（${dueLabel(n.due)}）`);
        if(isRecurring(n)) bits.push('🔁' + recurLabel(n));
        bits.push(`累計 ${humanMin(total)}`);
        meta.textContent = bits.join('　');
        body.append(meta);
      }
      li.append(body);

      if(n.type==='folder'){
        const open = document.createElement('button');
        open.className='mini'; open.textContent='›'; open.title='開く';
        open.onclick = e => { e.stopPropagation(); browseId=n.id; selId=null; renderTree(); };
        li.append(open);
      }
      const dots = document.createElement('button');
      dots.className='mini'; dots.textContent='⋯'; dots.title='編集';
      dots.onclick = e => { e.stopPropagation(); openForm('edit', n); };
      li.append(dots);

      li.onclick = () => { selId = (selId===n.id ? null : n.id); renderTree(); };
      li.ondblclick = () => { if(n.type==='folder'){ browseId=n.id; selId=null; renderTree(); } };
      list.append(li);
    });
  }

  // ===== 復習予定をカレンダーへ（.ics） =====
  // PWA は端末内で通知を予約できないので、カレンダーの予定として渡し、
  // iOS 標準の通知を鳴らしてもらう。
  const icsStamp = d => d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const icsEsc = s => String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');

  function buildIcs(rootId){
    const ids = descendants(rootId);
    const today = dayKey();
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//awapomo//review//JP','CALSCALE:GREGORIAN'];
    const now = icsStamp(new Date());
    let count = 0;

    const event = (uid, dayStr, summary, desc, minutes, rrule) => {
      const start = parseDay(dayStr); start.setHours(cfg.reviewHour, 0, 0, 0);
      const end = new Date(start.getTime() + minutes*60000);
      lines.push('BEGIN:VEVENT', `UID:${uid}@awapomo`, `DTSTAMP:${now}`,
        `DTSTART:${icsStamp(start)}`, `DTEND:${icsStamp(end)}`);
      if(rrule) lines.push(`RRULE:${rrule}`);
      lines.push(`SUMMARY:${icsEsc(summary)}`, `DESCRIPTION:${icsEsc(desc)}`,
        'BEGIN:VALARM', 'TRIGGER:-PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(summary)}`,
        'END:VALARM', 'END:VEVENT');
      count++;
    };

    // 繰り返しは RRULE 1件で登録するので、以降ずっとカレンダーが通知してくれる
    const rruleOf = n => {
      const r = recurOf(n), e = Math.max(1, r.every||1);
      if(r.freq==='daily')   return `FREQ=DAILY;INTERVAL=${e}`;
      if(r.freq==='weekly')  return `FREQ=WEEKLY;INTERVAL=${e}` +
        (r.days && r.days.length ? `;BYDAY=${r.days.map(d=>['SU','MO','TU','WE','TH','FR','SA'][d]).join(',')}` : '');
      if(r.freq==='monthly') return `FREQ=MONTHLY;INTERVAL=${e};BYMONTHDAY=${r.monthDay==='last' ? -1 : (r.monthDay||1)}`;
      if(r.freq==='yearly')  return `FREQ=YEARLY;INTERVAL=${e}`;
      return null;
    };

    Object.values(tree).forEach(n => {
      if(!ids.has(n.id) || n.type!=='task') return;
      const path = pathOf(n.id).slice(0,-1).map(x=>x.name).join(' / ');
      if(n.due && (isRecurring(n) || diffDays(n.due, today) >= 0)){
        event(`task-${n.id}`, n.due, n.name, path, Math.max(15, n.planMin||30), rruleOf(n));
      }
      if(reviewOn(n) && n.nextReview && diffDays(n.nextReview, today) >= 0 && !examPassed(n.id)){
        event(`rv-${n.id}-${n.nextReview}`, n.nextReview, `復習: ${n.name}`, path, 30, null);
      }
    });

    Object.values(tree).forEach(n => {
      if(!ids.has(n.id) || n.type!=='folder' || !n.study || !n.endDate) return;
      if(diffDays(n.endDate, today) < 0) return;
      event(`exam-${n.id}`, n.endDate, `試験日: ${n.name}`, '', 60, null);
    });

    lines.push('END:VCALENDAR');
    return { text: lines.join('\r\n'), count };
  }

  async function exportIcs(){
    const { text, count } = buildIcs(browseId);
    if(!count){ alert('カレンダーに入れる予定がありません。タスクに期日か繰り返しを設定してください。'); return; }
    const name = `awapomo-review-${dayKey()}.ics`;
    try{
      const file = new File([text], name, { type:'text/calendar' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:'復習の予定' });
        return;
      }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const url = URL.createObjectURL(new Blob([text], { type:'text/calendar' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  $('btnIcs').onclick = () => exportIcs();

  // ===== 作業用ノイズ =====
  // 生成した音を WAV にして <audio> でループ再生する。
  // Web Audio を鳴らしっぱなしにするより、iOS でバックグラウンドに強く、
  // ロック画面の再生コントロールにも乗る。
  function toWav(samples, rate){
    const n = samples.length, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
    const w = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4, 36+n*2, true); w(8,'WAVE'); w(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    w(36,'data'); v.setUint32(40, n*2, true);
    for(let i=0, o=44; i<n; i++, o+=2){
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, s<0 ? s*0x8000 : s*0x7fff, true);
    }
    return new Blob([buf], { type:'audio/wav' });
  }

  function makeNoise(kind, sec=20, rate=44100){
    const n = sec*rate, out = new Float32Array(n);
    if(kind==='white'){
      for(let i=0;i<n;i++) out[i] = (Math.random()*2-1) * 0.35;
    }else if(kind==='pink'){
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<n;i++){
        const wn = Math.random()*2-1;
        b0=0.99886*b0+wn*0.0555179; b1=0.99332*b1+wn*0.0750759; b2=0.96900*b2+wn*0.1538520;
        b3=0.86650*b3+wn*0.3104856; b4=0.55000*b4+wn*0.5329522; b5=-0.7616*b5-wn*0.0168980;
        out[i] = (b0+b1+b2+b3+b4+b5+b6+wn*0.5362) * 0.09;
        b6 = wn*0.115926;
      }
    }else{  // brown
      let last = 0;
      for(let i=0;i<n;i++){
        const wn = Math.random()*2-1;
        last = (last + 0.02*wn) / 1.02;
        out[i] = last * 3.2;
      }
    }
    // 継ぎ目が鳴らないように、末尾を先頭へクロスフェードしてから切り落とす
    const cf = Math.min(Math.floor(rate*0.5), n>>2);
    for(let i=0;i<cf;i++){
      const t = i/cf;
      out[i] = out[i]*t + out[n-cf+i]*(1-t);
    }
    return toWav(out.subarray(0, n-cf), rate);
  }

  const noiseUrls = {};
  let noiseEl = null, noisePlaying = false;

  function noiseAudio(){
    if(!noiseEl){
      noiseEl = new Audio();
      noiseEl.loop = true;
      noiseEl.preload = 'auto';
      noiseEl.addEventListener('pause', () => { noisePlaying = false; renderNoise(); });
      noiseEl.addEventListener('play',  () => { noisePlaying = true;  renderNoise(); });
    }
    return noiseEl;
  }

  async function noisePlay(){
    const kind = cfg.noiseKind;
    if(!noiseUrls[kind]) noiseUrls[kind] = URL.createObjectURL(makeNoise(kind));
    const a = noiseAudio();
    if(a.dataset.kind !== kind){ a.src = noiseUrls[kind]; a.dataset.kind = kind; }
    a.volume = cfg.noiseVol/100;
    try{
      await a.play();
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata = new MediaMetadata({
          title: { brown:'ブラウンノイズ', pink:'ピンクノイズ', white:'ホワイトノイズ' }[kind],
          artist: 'あわポモ風タイマー'
        });
        navigator.mediaSession.setActionHandler('pause', noiseStop);
        navigator.mediaSession.setActionHandler('play', noisePlay);
      }
    }catch{ noisePlaying = false; renderNoise(); }
  }
  function noiseStop(){ if(noiseEl) noiseEl.pause(); }

  // ===== 参考書のバーコード登録 =====
  const isbnOk = s => {
    if(!/^97[89]\d{10}$/.test(s)) return false;
    let sum = 0;
    for(let i=0;i<12;i++) sum += (+s[i]) * (i%2 ? 3 : 1);
    return ((10 - sum%10) % 10) === +s[12];
  };

  let zxReady = null;
  function ensureZXing(){
    if(zxReady) return zxReady;
    zxReady = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'vendor/zxing-reader.js';
      s.onload = () => {
        try{
          window.ZXingWASM.prepareZXingModule({
            overrides: { locateFile: (p, prefix) => p.endsWith('.wasm') ? 'vendor/zxing_reader.wasm' : prefix + p }
          });
          res(window.ZXingWASM);
        }catch(e){ rej(e); }
      };
      s.onerror = () => rej(new Error('load failed'));
      document.head.append(s);
    }).catch(e => { zxReady = null; throw e; });
    return zxReady;
  }

  // Google Books と openBD の両方に問い合わせ、取れた方を採用する
  async function lookupIsbn(isbn){
    const json = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
    const [gr, or_] = await Promise.all([
      json(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`),
      json(`https://api.openbd.jp/v1/get?isbn=${isbn}`)
    ]);
    const ob = or_ && or_[0] && or_[0].summary ? or_[0].summary : null;
    const gb = gr && gr.items && gr.items[0] ? gr.items[0].volumeInfo : null;
    if(!ob && !gb) return null;
    const https = u => u ? u.replace(/^http:/, 'https:') : '';
    return {
      isbn,
      title:     (ob && ob.title) || (gb && [gb.title, gb.subtitle].filter(Boolean).join(' ')) || '',
      author:    (ob && ob.author) || (gb && (gb.authors||[]).join(', ')) || '',
      publisher: (ob && ob.publisher) || (gb && gb.publisher) || '',
      pubdate:   (ob && ob.pubdate) || (gb && gb.publishedDate) || '',
      // 書影は openBD → Google Books → 国立国会図書館サーチ の順に探す
      cover:     https((ob && ob.cover) || (gb && gb.imageLinks && (gb.imageLinks.thumbnail || gb.imageLinks.smallThumbnail)) || '')
                 || `https://ndlsearch.ndl.go.jp/thumbnail/${isbn}.jpg`
    };
  }

  // 書影は縮小して端末内に持たせる。無い本も多いので、取れなければ表紙なしにする
  async function toThumb(url){
    if(!url) return '';
    try{
      const r = await fetch(url, { mode:'cors' });
      if(!r.ok) return '';   // 404 / 403 = その本の書影は無い
      const bmp = await createImageBitmap(await r.blob());
      const w = 96, h = Math.max(1, Math.round(bmp.height * w / bmp.width));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(bmp, 0, 0, w, h);
      return c.toDataURL('image/jpeg', 0.75);
    }catch{ return url; }
  }

  let scanStream = null, scanTimer = null, scanCanvas = null, foundBook = null;

  function scanMsg(t){ $('scanMsg').textContent = t; }
  function closeScanner(){
    if(scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    $('scanVideo').srcObject = null;
    $('scan').classList.add('hidden');

  async function openScanner(){
    foundBook = null;
    $('scan').classList.remove('hidden');
    $('scanResult').innerHTML = '';
    $('isbnInput').value = '';
    scanMsg('本の裏の上段バーコード（978…）を枠に合わせてください');

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !location.protocol.startsWith('http')){
      $('scanStage').classList.add('hidden');
      scanMsg('');
      showLine('カメラを使うには https で開く必要があります。ISBN の手入力は使えます。');
      return;
    }
    $('scanStage').classList.remove('hidden');
    try{
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false
      });
    }catch{
      $('scanStage').classList.add('hidden');
      showLine('カメラを開けませんでした。ISBN を手入力してください。');
      return;
    }
    const v = $('scanVideo');
    v.srcObject = scanStream;
    try{ await v.play(); }catch{}

    let zx;
    try{ zx = await ensureZXing(); }
    catch{ showLine('読み取りエンジンを読み込めませんでした。ISBN を手入力してください。'); return; }

    scanCanvas = scanCanvas || document.createElement('canvas');
    const ctx = scanCanvas.getContext('2d', { willReadFrequently:true });
    let busy = false;
    scanTimer = setInterval(async () => {
      if(busy || foundBook || !v.videoWidth) return;
      busy = true;
      try{
        // 枠の位置（縦 36%〜62%）だけを切り出して精度と速度を上げる
        const vw = v.videoWidth, vh = v.videoHeight;
        const sx = Math.round(vw*0.05), sw = Math.round(vw*0.90);
        const sy = Math.round(vh*0.30), sh = Math.round(vh*0.40);
        scanCanvas.width = sw; scanCanvas.height = sh;
        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, sw, sh);
        const res = await zx.readBarcodes(ctx.getImageData(0,0,sw,sh), {
          formats:['EAN13'], tryHarder:true, tryRotate:true, maxNumberOfSymbols:2
        });
        const hit = res.find(r => r.isValid && isbnOk(r.text));
        if(hit) onIsbn(hit.text);
      }catch{}
      busy = false;
    }, 220);
  }

  async function onIsbn(isbn){
    if(foundBook) return;

    if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
    if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; $('scanVideo').srcObject = null; }
    beep('start');
    try{ navigator.vibrate && navigator.vibrate(40); }catch{}
    scanMsg('');
    showLine(`ISBN ${isbn} を検索しています…`);

    let book = null;
    try{ book = await lookupIsbn(isbn); }catch{}
    if(!book){
      book = { isbn, title:'', author:'', publisher:'', pubdate:'', cover:'' };
      showLine('書誌情報が見つかりませんでした。書名を入力して登録できます。');
    }
    foundBook = book;
    renderBook(book);
  }

  function catOf(nodeId, depth){
    const p = pathOf(nodeId);
    if(!p.length) return { id:'_none', name:'未分類' };
    const n = p[Math.min(depth-1, p.length-1)];
    return { id:n.id, name:n.name };
  }

  function colEl(dayName, segs, title){
    const col = document.createElement('div'); col.className='col';
    const wrap = document.createElement('div'); wrap.className='barwrap'; wrap.title = title||'';
    [...segs].reverse().forEach(s => {
      const b = document.createElement('div');
      b.className = 'b' + (segs.length===1?' solo':'') + (s.today?' today':'') + (s.zero?' zero':'');
      b.style.height = `${Math.max(2, s.h*100)}%`;
      if(s.color) b.style.background = s.color;
      if(s.title) b.title = s.title;
      wrap.append(b);
    });
    const lab = document.createElement('div'); lab.className='d'; lab.textContent = dayName;
    col.append(wrap, lab);
    return col;
  }
  function renderChart(){
    const days = [];
    for(let i=6;i>=0;i--) days.push(addDays(new Date(), -i));
    const names = ['日','月','火','水','木','金','土'];
    const chart = $('chart'), legend = $('legend');
    chart.innerHTML = ''; legend.innerHTML = '';

    if(!ui.byTask){
      const vals = days.map(dd => (records[dayKey(dd)]||{}).work || 0);
      const max = Math.max(60*25, ...vals);
      days.forEach((dd,i) => chart.append(colEl(names[dd.getDay()],
        [{h: vals[i]/max, today:i===days.length-1, zero:!vals[i]}], `${dayKey(dd)}　${humanMin(vals[i])}`)));
      return;
    }
    const depth = ui.depth;
    const perDay = days.map(dd => {
      const k = dayKey(dd), m = new Map();
      logs.forEach(l => {
        if(dayKey(new Date(l.start))!==k) return;
        const c = catOf(l.nodeId, depth);
        m.set(c.id, { name:c.name, sec:((m.get(c.id)||{}).sec||0) + l.sec });
      });
      return m;
    });
    const totals = new Map();
    perDay.forEach(m => m.forEach((v,k) => totals.set(k, { name:v.name, sec:((totals.get(k)||{}).sec||0)+v.sec })));
    const order = [...totals.entries()].sort((a,b)=>b[1].sec-a[1].sec).map(e=>e[0]);
    const color = id => id==='_none' ? 'var(--fg-dim)' : (tree[id] ? colorOf(id) : PALETTE[order.indexOf(id)%PALETTE.length]);
    const max = Math.max(60*25, ...perDay.map(m => [...m.values()].reduce((a,v)=>a+v.sec,0)));

    days.forEach((dd,i) => {
      const segs = order.filter(id => perDay[i].has(id)).map(id => ({
        h: perDay[i].get(id).sec/max, color: color(id),
        title: `${perDay[i].get(id).name}　${humanMin(perDay[i].get(id).sec)}`
      }));
      const total = [...perDay[i].values()].reduce((a,v)=>a+v.sec,0);
      chart.append(colEl(names[dd.getDay()], segs.length?segs:[{h:0, zero:true}], `${dayKey(dd)}　${humanMin(total)}`));
    });
    if(!order.length){
      const s = document.createElement('span'); s.textContent='まだタスク別の記録がありません。';
      legend.append(s);
    }
    order.slice(0,8).forEach(id => {
      const s = document.createElement('span');
      const i = document.createElement('i'); i.style.background = color(id);
      s.append(i, document.createTextNode(`${totals.get(id).name}　${humanMin(totals.get(id).sec)}`));
      legend.append(s);
    });
  }

    const cal = $('cal'); cal.innerHTML = '';
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    $('calLabel').textContent = `${y}年${m+1}月`;
    ['日','月','火','水','木','金','土'].forEach(w => {

    });
    const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
    const vals = [];
    for(let i=1;i<=last.getDate();i++) vals.push(((records[dayKey(new Date(y,m,i))]||{}).work)||0);
    const max = Math.max(60*60, ...vals);
    const today = dayKey();
    for(let i=0;i<first.getDay();i++){
      const c = document.createElement('div'); c.className='cell blank'; cal.append(c);
    }
    for(let i=1;i<=last.getDate();i++){

      const c = document.createElement('div');
      c.className = 'cell' + (k===today ? ' today':'');

    const sum = vals.reduce((a,b)=>a+b,0), acted = vals.filter(v=>v>=60).length;

  // ===== バックアップ =====
  // iPhone では共有シートが開くので、そのまま「ファイル」や iCloud Drive に保存できる
  async function exportData(){
    const json = JSON.stringify({ v:2, exportedAt:new Date().toISOString(), cfg, records, logs, tree, ui, dones }, null, 2);
    const name = `awapomo-${dayKey()}.json`;
    let shared = false;
    try{
      const file = new File([json], name, { type:'application/json' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:'あわポモのバックアップ' });
        shared = true;
      }
    }catch(e){
      if(e && e.name === 'AbortError') return false;   // ユーザーが共有をやめた
    }
    if(!shared){
      const url = URL.createObjectURL(new Blob([json], { type:'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    ui.lastBackup = Date.now(); ui.backupSnooze = 0;
    save(K_UI, ui);
    renderNotice();
    return true;
  }

  function renderNotice(){
    const label = $('backupLabel');
    if(label) label.textContent = ui.lastBackup
      ? `最終 ${new Date(ui.lastBackup).toLocaleDateString('ja-JP')}`
      : 'まだ書き出していません';

    const DAY = 86400000;
    const stale = !ui.lastBackup || Date.now() - ui.lastBackup > 14*DAY;
    const snoozed = ui.backupSnooze && Date.now() - ui.backupSnooze < 3*DAY;
    const worth = logs.length >= 3;
    const show = worth && stale && !snoozed;
    $('backupNote').classList.toggle('hidden', !show);
    if(show){
      $('backupNoteText').textContent = ui.lastBackup
        ? '前回のバックアップから2週間たちました。記録をファイルに保存しておきませんか。'
        : '記録はこの端末の中だけにあります。ファイルに保存しておくと安心です。';
    }
  }

  // ===== 設定 =====
  function bindSettings(){
    const map = { cfgIdling:'idlingMin', cfgAuto:'autoSec', cfgCheckin:'checkinMin', cfgSteps:'steps',
                  cfgReviewHour:'reviewHour', cfgNoiseAuto:'noiseAuto', cfgNoiseInRest:'noiseInRest',
                  cfgSound:'sound', cfgNotify:'notify', cfgWake:'wake', cfgHideRec:'hideRec' };
    for(const [id, key] of Object.entries(map)){
      const node = $(id);
      if(node.type==='checkbox') node.checked = cfg[key]; else node.value = cfg[key];
      node.addEventListener('change', async () => {
        if(node.type==='checkbox'){
          cfg[key] = node.checked;
          if(key==='notify' && node.checked && 'Notification' in window){
            const p = await Notification.requestPermission();
            if(p!=='granted'){ cfg.notify=false; node.checked=false; }
          }
          if(key==='wake') updateWakeLock();
          if(key==='hideRec'){ renderHead(); renderToday(); }
        }else if(node.type==='number'){
          const v = Number(node.value);
          cfg[key] = Number.isFinite(v) ? Math.max(Number(node.min), Math.min(Number(node.max), v)) : DEFAULT_CFG[key];
          node.value = cfg[key];
        }else{
          cfg[key] = node.value.trim() || DEFAULT_CFG[key];
          if(key==='steps'){ cfg.steps = stepList().join(','); node.value = cfg.steps; }
        }
        save(K_CFG, cfg); render();
      });
    }
    $('btnExport').onclick = () => exportData();
    $('btnImport').onclick = () => $('fileInput').click();
    $('fileInput').onchange = e => {
      const file = e.target.files[0]; if(!file) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const d = JSON.parse(r.result);
          if(!confirm('現在のデータを読み込んだ内容で置き換えます。よろしいですか？')) return;
          if(d.cfg) cfg = Object.assign({}, DEFAULT_CFG, d.cfg);
          records = d.records||{}; logs = d.logs||[]; tree = d.tree||{}; dones = d.dones||[];
          ui = Object.assign({}, UI_DEFAULT, d.ui||{});
          save(K_CFG,cfg); save(K_REC,records); save(K_LOG,logs); save(K_TREE,tree);
          save(K_UI,ui); save(K_DONE,dones);
          location.reload();
        }catch{ alert('読み込めませんでした。'); }
      };
      r.readAsText(file);
      e.target.value = '';
    };
    $('btnReset').onclick = () => {
      if(!confirm('作業時間の記録をすべて削除します（フォルダ・タスクは残ります）。よろしいですか？')) return;
      records = {}; logs = [];
      save(K_REC, records); save(K_LOG, logs);
      renderStats(); renderTree();
    };
  }

  // ===== 選択ボタン =====
  $('btnContinue').onclick = () => goto(WORK);
  $('btnBreak').onclick    = () => { beep('rest'); goto(REST); };

  // ===== ループ =====
  setInterval(() => {
    render();
    if(st.mode!==IDLE && Date.now()-lastFlush>10000){ flush(); renderSummary(); renderChart(); renderCal(); }
  }, 250);

  const persist = () => { if(st.mode!==IDLE) flush(); };
  document.addEventListener('visibilitychange', () => { persist(); if(!document.hidden) updateWakeLock(); });
  window.addEventListener('pagehide', persist);
  window.addEventListener('beforeunload', persist);

  document.addEventListener('keydown', e => {
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(e.code==='Space'){
      e.preventDefault();
      if(st.mode===IDLE) startSession();
      else if(st.mode===CHOICE || st.mode===REST) goto(WORK);
      else { beep('rest'); goto(REST); }
    }
  });

  bindSettings();
  $('buildLabel').textContent = BUILD;
  $('noiseKind').value = cfg.noiseKind;
  $('noiseVol').value  = cfg.noiseVol;
  renderNoise();
  setView(ui.view || 'bar');
  dayStamp = dayKey();
  autoReset();              // 毎日・毎週のやり残しを次の機会へ送る
  render();
  renderTree();
  renderStats();
  renderToday();
  setTab(ui.tab || 'today');

  // 日付がまたいだら「今日」を組み直す
  setInterval(() => {
    if(dayStamp !== dayKey()){ dayStamp = dayKey(); autoReset(); renderToday(); renderTree(); renderStats(); }
  }, 60000);
})();

// ホーム画面アプリ（PWA）用。http(s) 配信時のみ有効
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
